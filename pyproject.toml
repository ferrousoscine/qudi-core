# NOTE: This file is for tool configuration only (ruff, pytest, mypy, coverage).
# Dependencies are NOT read from here when using Nix.
# All dependencies are defined in flake.nix for reproducibility.
#
# For non-Nix users, this file can still be used for pip/uv installation,
# but you must manually keep [project.dependencies] in sync with flake.nix.

[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "qudi-core"
dynamic = ["version"]
description = "A modular measurement application framework"
readme = "README.md"
keywords = [
    "qudi",
    "diamond",
    "quantum",
    "confocal",
    "automation",
    "experiment",
    "measurement",
    "framework",
    "lab",
    "laboratory",
    "instrumentation",
    "instrument",
    "modular",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",

    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",

    "Natural Language :: English",

    "Operating System :: Microsoft :: Windows :: Windows 8",
    "Operating System :: Microsoft :: Windows :: Windows 8.1",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.8"
dependencies = [
    "cycler>=0.10.0",
    "entrypoints>=0.3",
    "fysom>=2.1.6",
    "GitPython>=3.1.24",
    "jupyter>=1.0.0",
    "jupytext>=1.13.0",
    "lmfit>=1.0.3",
    "matplotlib>=3.4.3",
    "numpy>=1.21.3",
    "pyqtgraph>=0.13.0",
    "PySide6>=6.0.0",  # UPGRADED from PySide2 for Python 3.13 compatibility
    "rpyc>=5.0.1, <6",
    "ruamel.yaml>=0.17.16",
    "scipy>=1.7.1",
    "jsonschema>=4.2.1",
    "qtconsole>=5.5.0",
]

[project.optional-dependencies]
dev-lint-format = ["ruff==0.7.0",]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "docs/**",
]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    # Style preferences
    "E501",    # line too long (handled by formatter)
    "D",       # pydocstyle (too noisy for scientific code)
    "ANN",     # flake8-annotations (gradual typing)
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # implicit string concat (conflicts with formatter)

    # Scientific code conventions
    "N803",    # argument name lowercase (physics uses capitals)
    "N806",    # variable lowercase (physics uses capitals)
    "N802",    # function name lowercase (Qt uses camelCase)
    "N815",    # mixedCase in class scope (Qt convention)
    "N816",    # mixedCase in global scope
    "N817",    # CamelCase imported as acronym (common in scientific code)
    "NPY002",  # legacy np.random (scientific code)

    # Practical exceptions
    "PLR0913", # too many arguments (scientific functions need them)
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic values (physics constants)
    "C901",    # too complex
    "ERA001",  # commented-out code (keep for reference)
    "FBT",     # boolean trap (Qt signals use bools)
    "TD",      # TODO format
    "FIX",     # fixme comments

    # GUI code
    "SLF001",  # private member access (Qt internals)
    "ARG002",  # unused method argument (Qt signal signatures)

    # Exceptions for legacy compatibility
    "TRY003",  # long exception messages
    "EM",      # exception message style

    # Framework error handling
    "BLE001",  # blind exception (framework needs broad error handling)
    "S110",    # try-except-pass (intentional error suppression)
    "TRY300",  # else block in try (style preference)
    "TRY004",  # prefer TypeError (style preference)

    # Scientific code patterns
    "PLW0603", # global statement (necessary for some patterns)
    "PLW0602", # global without assignment (necessary for some patterns)
    "DTZ005",  # datetime.now without tz (local time intentional)
    "DTZ006",  # datetime.fromtimestamp without tz (local time intentional)
    "PLW2901", # loop variable overwritten (intentional in numerical code)
    "PLR0911", # too many return statements
    "S102",    # exec detected (needed for dynamic UI loading)
    "S603",    # subprocess call security (framework code)
    "S607",    # partial path in subprocess (framework code)
    "LOG015",  # warning on root logger (Qt handlers)
    "SIM102",  # nested if statements (readability preference)
    "SIM108",  # ternary operator (readability preference)
    "TRY301",  # raise to inner function (style)
    "EXE001",  # shebang without executable (packaging handles this)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]
"tests/notebooks/**" = ["F821"]  # cell dependencies in notebooks
"src/qudi/tools/**" = ["T201"]
"src/qudi/core/parentpoller.py" = ["PLC0415"]  # platform-specific imports
"src/qudi/core/qudikernel.py" = ["PLC0415"]  # deferred imports
"src/qudi/core/gui/main_gui/main_gui.py" = ["PLC0415"]  # optional version import
"src/qudi/core/logger/handlers.py" = ["PLC0415"]  # deferred traceback import
"src/qudi/runnable.py" = ["PLC0415"]  # platform-specific imports
"src/qudi/tools/config_editor/module_finder.py" = ["PLC0415"]  # optional module imports
"src/qudi/util/widgets/plotting/view_box.py" = ["PLC0415"]  # version check import

[tool.ruff.lint.isort]
known-first-party = ["qudi"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.pylint]
max-args = 10

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/qudi"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[project.scripts]
qudi = "qudi.runnable:main"
qudi-config-editor = "qudi.tools.config_editor.config_editor:main"
qudi-uninstall-kernel = "qudi.core.qudikernel:uninstall_kernel"
qudi-install-kernel = "qudi.core.qudikernel:install_kernel"

[project.urls]
Homepage = "https://github.com/Ulm-IQO/qudi-core"
Documentation = "https://ulm-iqo.github.io/qudi-core/"
Repository = "https://github.com/Ulm-IQO/qudi-core.git"
"Bug Tracker" = "https://github.com/Ulm-IQO/qudi-core/issues"
Changelog = "https://github.com/Ulm-IQO/qudi-core/blob/main/docs/changelog.md"

[tool.setuptools.dynamic]
version = {file = "VERSION"}
