# NOTE: This file is for tool configuration only (ruff, pytest, mypy, coverage).
# Dependencies are NOT read from here when using Nix.
# All dependencies are defined in flake.nix for reproducibility.
#
# For non-Nix users, this file can still be used for pip/uv installation,
# but you must manually keep [project.dependencies] in sync with flake.nix.

[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "qudi-core"
dynamic = ["version"]
description = "A modular measurement application framework"
readme = "README.md"
keywords = [
    "qudi",
    "diamond",
    "quantum",
    "confocal",
    "automation",
    "experiment",
    "measurement",
    "framework",
    "lab",
    "laboratory",
    "instrumentation",
    "instrument",
    "modular",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",

    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",

    "Natural Language :: English",

    "Operating System :: Microsoft :: Windows :: Windows 8",
    "Operating System :: Microsoft :: Windows :: Windows 8.1",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.8"
dependencies = [
    "cycler>=0.10.0",
    "entrypoints>=0.3",
    "fysom>=2.1.6",
    "GitPython>=3.1.24",
    "jupyter>=1.0.0",
    "jupytext>=1.13.0",
    "lmfit>=1.0.3",
    "matplotlib>=3.4.3",
    "numpy>=1.21.3",
    "pyqtgraph>=0.13.0",
    "PySide6>=6.0.0",  # UPGRADED from PySide2 for Python 3.13 compatibility
    "rpyc>=5.0.1, <6",
    "ruamel.yaml>=0.17.16",
    "scipy>=1.7.1",
    "jsonschema>=4.2.1",
    "qtconsole>=5.5.0",
]

[project.optional-dependencies]
dev-lint-format = ["ruff==0.7.0",]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "docs/**",
]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "ERA001",  # Commented-out code
    "SLF001",  # Private member accessed
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
    "C901",  # Init method too complex
    "B905",  # zip strict parameter (Python 3.10+)
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/qudi"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[project.scripts]
qudi = "qudi.runnable:main"
qudi-config-editor = "qudi.tools.config_editor.config_editor:main"
qudi-uninstall-kernel = "qudi.core.qudikernel:uninstall_kernel"
qudi-install-kernel = "qudi.core.qudikernel:install_kernel"

[project.urls]
Homepage = "https://github.com/Ulm-IQO/qudi-core"
Documentation = "https://ulm-iqo.github.io/qudi-core/"
Repository = "https://github.com/Ulm-IQO/qudi-core.git"
"Bug Tracker" = "https://github.com/Ulm-IQO/qudi-core/issues"
Changelog = "https://github.com/Ulm-IQO/qudi-core/blob/main/docs/changelog.md"

[tool.setuptools.dynamic]
version = {file = "VERSION"}
